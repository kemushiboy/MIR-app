name: Build

# 手動実行 (Actions タブの "Run workflow") か、v で始まるタグの push でビルドする。
# タグ push 時は GitHub Release にインストーラを添付する。
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            name: windows
          - os: macos-latest # Apple Silicon ランナー。x64 版も同じランナーで作る
            script: dist:mac
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run ${{ matrix.script }}
        env:
          # 署名用の Secrets は任意。未設定なら署名なしでビルドする
          # macOS: Developer ID Application 証明書 (.p12 を base64 化したもの) とパスワード
          # Windows: コード署名証明書 (.pfx を base64 化したもの) とパスワード
          CSC_LINK: ${{ matrix.name == 'macos' && secrets.MAC_CSC_LINK || secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ matrix.name == 'macos' && secrets.MAC_CSC_KEY_PASSWORD || secrets.WIN_CSC_KEY_PASSWORD }}
          # macOS の公証 (notarization)。3 つとも設定したときだけ実行される
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: MIR-app-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
